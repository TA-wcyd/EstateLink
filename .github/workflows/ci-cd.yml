name: EstateLink CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

jobs:
  laravel-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, sqlite3, pdo_sqlite, fileinfo, openssl, tokenizer, xml, ctype, json, bcmath
          coverage: none

      - name: Verify PHP Version
        run: php -v

      - name: Create SQLite Database
        run: |
          mkdir -p database
          touch database/database.sqlite

      - name: Copy .env
        run: cp .env.example .env

      - name: Configure .env for CI (SQLite)
        run: |
          sed -i 's/DB_CONNECTION=mysql/DB_CONNECTION=sqlite/' .env
          sed -i 's|DB_HOST=127.0.0.1||' .env
          sed -i 's|DB_PORT=3306||' .env
          sed -i 's|DB_DATABASE=laravel|DB_DATABASE=database/database.sqlite|' .env
          sed -i 's|DB_USERNAME=root||' .env
          sed -i 's|DB_PASSWORD=||' .env

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install NPM Dependencies
        run: npm ci

      - name: Build Frontend
        run: npm run build

      - name: Run Database Migrations
        run: php artisan migrate --force

      - name: Run Tests
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
        run: php artisan test